<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-ontology — one page, every style</title>
<meta name="description" content="The same page in every style of the ontology. Each look comes from one generated tokens.css file.">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, sans-serif; background: #111; }

  /* Picker bar. It sits outside [data-style], so no style can change it. */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 10px 16px; background: #111; color: #f5f5f5; font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bar a { color: #f5f5f5; }
  .bar strong { font-weight: 700; }
  .bar select, .bar button { font: inherit; color: #111; background: #f5f5f5; border: 0; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .bar .vec { display: flex; gap: 10px; margin-left: auto; color: #aaa; }
  .bar .vec b { color: #f5f5f5; font-weight: 400; letter-spacing: 1px; }
  @media (max-width: 760px) { .bar .vec { margin-left: 0; flex-wrap: wrap; } }

  /* Sample page. Every visual value below is a token. */
  .stage { min-height: 100vh; padding: calc(var(--space-unit, 8px) * 6) clamp(16px, 5vw, 72px) 96px;
    transition: background var(--duration, 150ms) var(--ease, linear); }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { font-size: clamp(40px, 8vw, 88px); line-height: 1.02; margin: 12px 0 20px; overflow-wrap: anywhere; }
  .thesis { font-size: clamp(18px, 2.2vw, 24px); line-height: 1.45; max-width: 34em; margin: 0 0 32px; }
  .row { display: flex; flex-wrap: wrap; gap: calc(var(--space-unit, 8px) * 2); align-items: center; margin-bottom: 48px; }
  .action { cursor: pointer; font-weight: 700; }
  .action.ghost { background: transparent; color: var(--color-text); }
  input.field { font: inherit; padding: calc(var(--space-unit, 8px) * 1.5) calc(var(--space-unit, 8px) * 2); min-width: 220px;
    color: var(--color-text); background: var(--color-surface);
    border: var(--border-width) solid var(--color-border); border-radius: var(--border-radius); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: calc(var(--space-unit, 8px) * 3); margin-bottom: 48px; }
  .surface h3 { margin: 0 0 8px; font-size: 22px; line-height: 1.15; }
  .surface p { margin: 0; line-height: 1.5; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { width: 96px; font: 11px/1.3 ui-monospace, Menlo, monospace; }
  .swatch i { display: block; height: 56px; border: var(--border-width) solid var(--color-border); border-radius: var(--border-radius); margin-bottom: 6px; }
  .rules { margin: 48px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; line-height: 1.5; max-width: 46em; }
  .rules li::before { content: "→ "; color: var(--color-accent); }
  .foot { margin-top: 56px; font-size: 14px; }
</style>
<link id="tokens" rel="stylesheet" href="">
</head>
<body>

<div class="bar">
  <strong>design-ontology</strong>
  <button id="prev" aria-label="Previous style">←</button>
  <select id="pick" aria-label="Style"></select>
  <button id="next" aria-label="Next style">→</button>
  <span id="count"></span>
  <span class="vec" id="vec"></span>
</div>

<main class="stage" id="stage">
  <div class="wrap">
    <div class="eyebrow muted" id="eyebrow"></div>
    <h1 id="name">Loading…</h1>
    <p class="thesis" id="thesis"></p>

    <div class="row">
      <button class="action">Primary action</button>
      <button class="action ghost">Secondary</button>
      <input class="field" placeholder="you@example.com" aria-label="Sample input">
    </div>

    <div class="grid">
      <section class="surface"><h3>What it looks like</h3><p id="summary"></p></section>
      <section class="surface"><h3>Good for</h3><p id="uses"></p></section>
      <section class="surface"><h3>Feels</h3><p id="feels"></p></section>
    </div>

    <div class="swatches" id="swatches"></div>

    <p class="foot muted">
      This page has no style of its own. Each look comes from one generated file:
      <a id="tokfile" href="#"></a>. The agent instructions for the same style are in
      <a id="skillfile" href="#"></a>. Use ← and → to move.
    </p>
  </div>
</main>

<script>
const ROLES = ["--color-bg", "--color-surface", "--color-text", "--color-muted", "--color-primary", "--color-accent", "--color-border"];
const $ = (id) => document.getElementById(id);
const stage = $("stage"), pick = $("pick");
let skills = [], at = 0;

function loadFonts() {
  const cs = getComputedStyle(stage);
  const families = new Set();
  for (const v of ["--font-sans", "--font-display"]) {
    const first = cs.getPropertyValue(v).split(",")[0].trim().replace(/^["']|["']$/g, "");
    if (first && !/^(system-ui|sans-serif|serif|monospace|-apple-system)$/.test(first)) families.add(first);
  }
  for (const f of families) {
    const id = "font-" + f.replace(/\s+/g, "-");
    if (document.getElementById(id)) continue;
    const base = "https://fonts.googleapis.com/css2?display=swap&family=" + f.replace(/\s+/g, "+");
    const link = Object.assign(document.createElement("link"), { id, rel: "stylesheet", href: base + ":wght@400;700" });
    link.onerror = () => { link.onerror = null; link.href = base; };   // a family with one weight only
    document.head.append(link);
  }
}

function show(i) {
  at = (i + skills.length) % skills.length;
  const s = skills[at];
  const tokens = $("tokens");
  tokens.onload = () => {
    loadFonts();
    const cs = getComputedStyle(stage);
    $("swatches").innerHTML = ROLES.map((r) =>
      `<div class="swatch"><i style="background:var(${r})"></i>${r.replace("--color-", "")}<br><span class="muted">${cs.getPropertyValue(r).trim()}</span></div>`).join("");
  };
  tokens.href = "../" + s.tokens;
  stage.dataset.style = s.id;
  pick.value = s.id;
  $("eyebrow").textContent = `${s.period} · ${s.era.replace(/-/g, " ")}`;
  $("name").textContent = s.name;
  $("thesis").textContent = s.thesis;
  $("summary").textContent = s.summary;
  $("uses").textContent = s.use_cases.join(", ") + ".";
  $("feels").textContent = s.emotion.join(", ") + ".";
  $("count").textContent = `${at + 1} / ${skills.length}`;
  $("vec").innerHTML = Object.entries(s.vectors).map(([k, v]) =>
    `<span title="${k.replace(/_/g, " ")}">${k.slice(0, 4)} <b>${"■".repeat(v)}${"□".repeat(5 - v)}</b></span>`).join("");
  $("tokfile").textContent = s.tokens; $("tokfile").href = "../" + s.tokens;
  $("skillfile").textContent = s.path; $("skillfile").href = "../" + s.path;
  history.replaceState(null, "", "#" + s.id);
}

fetch("../skills/index.json").then((r) => r.json()).then((data) => {
  skills = data.skills.filter((s) => s.tokens);
  pick.innerHTML = skills.map((s) => `<option value="${s.id}">${s.name}</option>`).join("");
  const start = skills.findIndex((s) => s.id === location.hash.slice(1));
  show(start < 0 ? 0 : start);
});
pick.onchange = () => show(skills.findIndex((s) => s.id === pick.value));
addEventListener("hashchange", () => {
  const i = skills.findIndex((s) => s.id === location.hash.slice(1));
  if (i >= 0 && i !== at) show(i);
});
$("prev").onclick = () => show(at - 1);
$("next").onclick = () => show(at + 1);
addEventListener("keydown", (e) => {
  if (e.target.matches("input, select")) return;
  if (e.key === "ArrowLeft") show(at - 1);
  if (e.key === "ArrowRight") show(at + 1);
});
</script>
</body>
</html>
